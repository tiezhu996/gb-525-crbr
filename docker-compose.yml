name: food-allergen-crosscontact-analyzer

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-food-allergen-crosscontact-analyzer}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allergen_crosscontact}
      POSTGRES_USER: ${POSTGRES_USER:-allergen_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allergen_local_password}
    ports:
      - "${DB_PORT:-57525}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allergen_app} -d ${POSTGRES_DB:-allergen_crosscontact}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-food-allergen-crosscontact-analyzer}-backend
    environment:
      PORT: "8080"
      DB_DRIVER: postgres
      DB_DSN: host=postgres user=${POSTGRES_USER:-allergen_app} password=${POSTGRES_PASSWORD:-allergen_local_password} dbname=${POSTGRES_DB:-allergen_crosscontact} port=5432 sslmode=disable TimeZone=Asia/Shanghai
      DB_AUTO_MIGRATE: "true"
      JWT_SECRET: ${JWT_SECRET:-gb525-local-compose-jwt-secret-at-least-32-bytes}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18525,http://127.0.0.1:18525}
      MAX_PROPAGATION_DEPTH: ${MAX_PROPAGATION_DEPTH:-12}
      RISK_THRESHOLD_MEDIUM: ${RISK_THRESHOLD_MEDIUM:-0.12}
      RISK_THRESHOLD_HIGH: ${RISK_THRESHOLD_HIGH:-0.35}
      RISK_THRESHOLD_CRITICAL: ${RISK_THRESHOLD_CRITICAL:-0.65}
      RISK_THRESHOLD_VERSION: ${RISK_THRESHOLD_VERSION:-2026.1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-19525}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-food-allergen-crosscontact-analyzer}-frontend
    ports:
      - "${FRONTEND_PORT:-18525}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-food-allergen-crosscontact-analyzer}-postgres-data
